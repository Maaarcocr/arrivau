name: Embedded routing
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'api/**'
      - 'scripts/*osrm*'
      - 'scripts/test-embedded-routing.sh'
      - 'rust-toolchain.toml'
      - '.github/workflows/embedded-routing.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: embedded-routing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Real native OSRM matrix
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OSRM_BACKEND_PATH: ${{ github.workspace }}/.osrm-install
      OSRM_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Native dependency toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libboost-all-dev libtbb-dev liblua5.4-dev libbz2-dev libexpat1-dev libxml2-dev libzip-dev zlib1g-dev
          rustup show
      # Build ephemerally. Do not cache/upload the generated SDK or binaries
      # until a complete bundled third-party notice inventory is verified.
      - name: Build pinned native OSRM (no daemon)
        run: ./scripts/build-osrm.sh "$OSRM_BACKEND_PATH" "$RUNNER_TEMP/osrm-build"
      - name: Native lint and unit tests
        run: |
          cargo clippy --locked --manifest-path api/Cargo.toml --features embedded-osrm --all-targets -- -D warnings
          cargo test --locked --manifest-path api/Cargo.toml --features embedded-osrm
      - name: Actual native graph, asymmetric times and unreachable legs
        run: ./scripts/test-embedded-routing.sh
