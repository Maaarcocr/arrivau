name: Resolve Google Places build inputs
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Load pinned toolchain
        run: rustup show
      - name: Format authored Rust and preserve exact repair patch
        run: |
          cargo fmt --manifest-path api/Cargo.toml
          git diff -- api > formatted-api.patch
      - name: Export only source formatting patch
        uses: actions/upload-artifact@v4
        with:
          name: google-places-format
          path: formatted-api.patch
          if-no-files-found: error
      - name: Compile and test the complete API
        run: cargo test --locked --manifest-path api/Cargo.toml
