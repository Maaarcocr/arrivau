name: Arrivau
options:
  bundleIdPrefix: dev.arrivau
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
targets:
  Arrivau:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.arrivau.app
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          INFOPLIST_FILE: Config/Info-Debug.plist
        Release:
          INFOPLIST_FILE: Config/Info-Release.plist
  ArrivauTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Arrivau
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.arrivau.app.tests
        GENERATE_INFOPLIST_FILE: YES
  ArrivauUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Arrivau
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.arrivau.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Arrivau
schemes:
  Arrivau:
    build:
      targets:
        Arrivau: all
        ArrivauTests: [test]
        ArrivauUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: ArrivauTests
          parallelizable: false
        - name: ArrivauUITests
          parallelizable: false
      environmentVariables:
        ARRIVAU_API_URL: "http://localhost:8080"
