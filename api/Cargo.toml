[package]
name = "arrivau-api"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "arrivau-api"

[features]
default = []
embedded-osrm = ["dep:osrm_interface"]

[dependencies]
osrm_interface = { version = "=0.8.2", optional = true, default-features = false, features = ["native"] }
axum = "0.8"
argon2 = { version = "0.5", features = ["std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
rpassword = "7"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"


[[bin]]
name = "arrivau-routing-benchmark"
path = "src/bin/arrivau-routing-benchmark.rs"
required-features = ["embedded-osrm"]

