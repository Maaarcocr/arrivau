name: Arrivau
options:
  bundleIdPrefix: dev.arrivau
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
configs:
  Debug: debug
  Release: release
packages:
  GooglePlaces:
    url: https://github.com/googlemaps/ios-places-sdk
    exactVersion: 11.2.0
  GoogleNavigation:
    url: https://github.com/googlemaps/ios-navigation-sdk
    exactVersion: 11.2.0
  # Navigation declares Maps from 11.2.0; pin its transitive version too.
  GoogleMaps:
    url: https://github.com/googlemaps/ios-maps-sdk
    exactVersion: 11.2.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    ARRIVAU_API_URL: ""
    ARRIVAU_GOOGLE_MAPS_API_KEY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
targets:
  Arrivau:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    dependencies:
      - package: GooglePlaces
        product: GooglePlaces
      - package: GoogleNavigation
        product: GoogleNavigation
      - package: GoogleMaps
        product: GoogleMaps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.arrivau.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC"]
      configs:
        Debug:
          INFOPLIST_FILE: Config/Info-Debug.plist
        Release:
          INFOPLIST_FILE: Config/Info-Release.plist
  ArrivauTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Arrivau
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.arrivau.app.tests
        GENERATE_INFOPLIST_FILE: YES
  ArrivauUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Arrivau
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.arrivau.app.uitests
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info-UITests.plist
        TEST_TARGET_NAME: Arrivau
schemes:
  Arrivau:
    build:
      targets:
        Arrivau: all
        ArrivauTests: [test]
        ArrivauUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: ArrivauTests
          parallelizable: false
        - name: ArrivauUITests
          parallelizable: false
      environmentVariables:
        ARRIVAU_API_URL: "http://127.0.0.1:8080"



