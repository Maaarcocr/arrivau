name: Verify API and iOS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ui_suite:
        description: UI coverage to run
        type: choice
        options: [smoke, full]
        default: smoke
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api:
    name: Rust and real HTTP tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Format, lint and tests
        run: ./scripts/check.sh
      - name: Build server and smoke via HTTP
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path api/Cargo.toml
          TEST_DIR=$(mktemp -d)
          ARRIVAU_DEMO=1 ARRIVAU_DB_PATH="$TEST_DIR/smoke.sqlite3" api/target/debug/arrivau-api >"$TEST_DIR/api.log" 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true; cat "$TEST_DIR/api.log"' EXIT
          for i in {1..100}; do
            kill -0 "$API_PID" || exit 1
            if curl -fsS --max-time 1 http://127.0.0.1:8080/health >/dev/null; then break; fi
            sleep 0.2
          done
          python3 scripts/e2e.py
      - name: Build unprivileged deployment image
        run: docker build -f deploy/Dockerfile -t arrivau-pilot:${{ github.sha }} .
  ios:
    name: Native app to API E2E
    runs-on: macos-26
    timeout-minutes: 50
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      UI_SUITE: ${{ github.event_name == 'workflow_dispatch' && inputs.ui_suite || 'smoke' }}
    steps:
      - uses: actions/checkout@v4
      - name: Tool versions and project generator
        run: |
          xcodebuild -version
          rustup show
          brew install xcodegen
          xcodegen --version
          xcrun simctl list devices available
      - name: Inspect manual TestFlight CLI compatibility (no credentials)
        run: ./scripts/check-testflight-tools.sh
      - name: Verify app-only signing settings and archive Release (unsigned)
        id: release-build
        run: ./scripts/test-archive-scoping.sh
      - name: Run native unit tests and selected UI suite with real server
        id: native-tests
        shell: bash
        run: |
          case "$UI_SUITE" in
            smoke|full) ./scripts/test-ios.sh "--$UI_SUITE" ;;
            *) echo "Unsupported UI suite" >&2; exit 1 ;;
          esac
      # Raw .xcresult bundles can contain unrelated simulator service credentials
      # in compressed system diagnostics. Never upload the bundles or diagnostics.
      - name: Record safe iOS check summary
        if: always()
        env:
          RELEASE_RESULT: ${{ steps.release-build.outcome }}
          TEST_RESULT: ${{ steps.native-tests.outcome }}
        shell: bash
        run: |
          # Only these fixed status/suite words reach the summary, never tool output.
          case "$RELEASE_RESULT" in
            success|failure|cancelled|skipped) ;;
            *) RELEASE_RESULT=unknown ;;
          esac
          case "$TEST_RESULT" in
            success|failure|cancelled|skipped) ;;
            *) TEST_RESULT=unknown ;;
          esac
          case "$UI_SUITE" in
            smoke|full) ;;
            *) UI_SUITE=unknown ;;
          esac
          {
            printf '## iOS verification\n\n'
            printf -- '- UI suite: %s\n' "$UI_SUITE"
            printf -- '- Unsigned Release archive and app-only settings: %s\n' "$RELEASE_RESULT"
            printf -- '- Native unit and UI tests: %s\n' "$TEST_RESULT"
            printf '\nRaw Xcode result bundles and simulator diagnostics are intentionally not uploaded.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save main-screen screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arrivau-ios-screenshots
          path: ios/build/screenshots
          if-no-files-found: warn

